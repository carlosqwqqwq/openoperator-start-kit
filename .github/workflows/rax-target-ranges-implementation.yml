name: RAX shared target ranges implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rax-target-ranges-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rax-shared-target-ranges-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply, validate, and publish implementation
        shell: bash
        run: |
          base64 -d rax-target-ranges/run_range_impl.sh.gz.b64 \
            | gzip -d > /tmp/run_range_impl.sh
          chmod 700 /tmp/run_range_impl.sh
          /tmp/run_range_impl.sh

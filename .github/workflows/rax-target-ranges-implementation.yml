name: RAX shared target ranges implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rax-target-ranges-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rax-shared-target-ranges-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply, validate, and publish the private implementation branch
        shell: bash
        run: |
          set -uo pipefail
          state="rax-target-ranges"
          branch="feat/shared-target-range-collections-20260924"
          mkdir -p "$state"
          rm -f "$state/public-key.pem" "$state/result.json"

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/rax-range-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/rax-range-private.pem \
            -out "$state/public-key.pem" >/dev/null 2>&1

          git config user.name "rax-implementation-bot"
          git config user.email "102978772+carlosqwqqwq@users.noreply.github.com"
          git pull --rebase origin main
          git add "$state/public-key.pem"
          git commit -m "ci: publish one-time range implementation key"
          git push origin main

          found=0
          for _ in $(seq 1 450); do
            git pull --rebase origin main >/dev/null 2>&1 || true
            if [[ -s "$state/token.enc.b64" ]]; then
              found=1
              break
            fi
            sleep 2
          done
          [[ "$found" -eq 1 ]] || exit 2

          base64 -d "$state/token.enc.b64" > /tmp/rax-range-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/rax-range-private.pem \
            -in /tmp/rax-range-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/rax-range-token
          chmod 600 /tmp/rax-range-token

          cat > /tmp/rax-range-askpass <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat /tmp/rax-range-token ;;
            *) printf '\n' ;;
          esac
          ASKPASS
          chmod 700 /tmp/rax-range-askpass
          export GIT_ASKPASS=/tmp/rax-range-askpass
          export GIT_TERMINAL_PROMPT=0

          clone_rc=0
          patch_rc=99
          install_rc=99
          targeted_rc=99
          ruff_rc=99
          compile_rc=99
          full_rc=99
          push_rc=99
          base_sha=""
          head_sha=""

          git clone --single-branch --branch main \
            https://github.com/carlosqwqqwq/rax-research.git \
            /tmp/rax-range-repo \
            >/tmp/rax-range-clone.log 2>&1 || clone_rc=$?

          if [[ "$clone_rc" -eq 0 ]]; then
            cd /tmp/rax-range-repo
            base_sha="$(git rev-parse HEAD)"
            git submodule update --init --recursive \
              >/tmp/rax-range-submodules.log 2>&1 || true

            base64 -d "$GITHUB_WORKSPACE/rax-target-ranges/apply_range_patch.py.gz.b64" \
              | gzip -d > /tmp/apply_range_patch.py
            chmod 700 /tmp/apply_range_patch.py
            RAX_REPO_ROOT="$PWD" python /tmp/apply_range_patch.py \
              >/tmp/rax-range-patch.log 2>&1
            patch_rc=$?

            if [[ "$patch_rc" -eq 0 ]]; then
              python -m pip install --upgrade pip \
                >/tmp/rax-range-install.log 2>&1
              python -m pip install -e ".[dev,agent]" \
                >>/tmp/rax-range-install.log 2>&1
              install_rc=$?
            fi

            if [[ "$install_rc" -eq 0 ]]; then
              python -m pytest -q \
                tests/test_target_ranges.py \
                tests/test_real_repo_target_resolution.py \
                >/tmp/rax-range-targeted.log 2>&1
              targeted_rc=$?

              python -m ruff check \
                src/rax \
                benchmarks/real_repos \
                tests/test_target_ranges.py \
                tests/test_real_repo_target_resolution.py \
                >/tmp/rax-range-ruff.log 2>&1
              ruff_rc=$?

              python -m compileall -q \
                src/rax \
                benchmarks/real_repos \
                tests/test_target_ranges.py \
                tests/test_real_repo_target_resolution.py \
                >/tmp/rax-range-compile.log 2>&1
              compile_rc=$?

              python -m pytest -q >/tmp/rax-range-full.log 2>&1
              full_rc=$?
            fi

            if [[ "$patch_rc" -eq 0 && "$install_rc" -eq 0 && \
                  "$targeted_rc" -eq 0 && "$ruff_rc" -eq 0 && \
                  "$compile_rc" -eq 0 && "$full_rc" -eq 0 ]]; then
              git config user.name "carlos"
              git config user.email "102978772+carlosqwqqwq@users.noreply.github.com"
              git checkout -b "$branch"
              git add README.md docs src benchmarks tests
              git commit -m "feat: share canonical target range collections across M1 and M3"
              head_sha="$(git rev-parse HEAD)"
              git fetch origin "$branch:refs/remotes/origin/$branch" \
                >/dev/null 2>&1 || true
              git push --force-with-lease origin \
                "HEAD:refs/heads/$branch" \
                >/tmp/rax-range-push.log 2>&1
              push_rc=$?
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          python - "$clone_rc" "$patch_rc" "$install_rc" "$targeted_rc" \
            "$ruff_rc" "$compile_rc" "$full_rc" "$push_rc" \
            "$base_sha" "$head_sha" "$branch" <<'PY'
          import json
          import sys
          from pathlib import Path

          names = (
              "clone_rc",
              "patch_rc",
              "install_rc",
              "targeted_pytest_rc",
              "ruff_rc",
              "compileall_rc",
              "full_pytest_rc",
              "push_rc",
          )
          values = [int(value) for value in sys.argv[1:9]]
          payload = {
              "schema": "rax.implementation-validation.v1",
              "status": "pass" if values == [0] * 8 else "fail",
              "repository": "carlosqwqqwq/rax-research",
              "base_sha": sys.argv[9],
              "head_sha": sys.argv[10],
              "branch": sys.argv[11],
              **dict(zip(names, values, strict=True)),
          }
          Path("rax-target-ranges/result.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          if [[ "$clone_rc" -ne 0 || "$patch_rc" -ne 0 || \
                "$install_rc" -ne 0 || "$targeted_rc" -ne 0 || \
                "$ruff_rc" -ne 0 || "$compile_rc" -ne 0 || \
                "$full_rc" -ne 0 || "$push_rc" -ne 0 ]]; then
            for name in clone patch install targeted ruff compile full push; do
              log="/tmp/rax-range-${name}.log"
              if [[ -s "$log" ]]; then
                echo "===== $name ====="
                tail -n 100 "$log"
              fi
            done
          fi

          rm -f "$state/token.enc.b64" "$state/public-key.pem"
          rm -f /tmp/rax-range-token /tmp/rax-range-token.enc \
            /tmp/rax-range-private.pem /tmp/rax-range-askpass \
            /tmp/apply_range_patch.py
          git add -A "$state"
          git commit -m "ci: record target-range implementation result" || true
          git push origin main

          if [[ "$clone_rc" -ne 0 || "$patch_rc" -ne 0 || \
                "$install_rc" -ne 0 || "$targeted_rc" -ne 0 || \
                "$ruff_rc" -ne 0 || "$compile_rc" -ne 0 || \
                "$full_rc" -ne 0 || "$push_rc" -ne 0 ]]; then
            exit 1
          fi

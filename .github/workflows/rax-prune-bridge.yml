name: One-time encrypted RAX cleanup bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rax-prune-bridge.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPO: carlosqwqqwq/rax-research
      TARGET_REF: ops/one-time-remote-branch-prune-20260924
      TARGET_SCRIPT: tools/one_time_remote_branch_prune.sh
      PUBLIC_KEY_PATH: rax-prune/public-key.pem
      CIPHERTEXT_PATH: rax-prune/ciphertext.txt
      WORKFLOW_PATH: .github/workflows/rax-prune-bridge.yml
    steps:
      - name: Receive one-time encrypted token and run private cleanup script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          helper_token="$GH_TOKEN"
          helper_repo="$GITHUB_REPOSITORY"
          helper_branch="$GITHUB_REF_NAME"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          put_helper_file() {
            local path="$1" source="$2" message="$3" encoded sha
            encoded="$(base64 -w0 "$source")"
            sha="$(GH_TOKEN="$helper_token" gh api "repos/$helper_repo/contents/$path?ref=$helper_branch" --jq .sha 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              GH_TOKEN="$helper_token" gh api --method PUT "repos/$helper_repo/contents/$path" \
                -f message="$message" -f content="$encoded" -f sha="$sha" -f branch="$helper_branch" >/dev/null
            else
              GH_TOKEN="$helper_token" gh api --method PUT "repos/$helper_repo/contents/$path" \
                -f message="$message" -f content="$encoded" -f branch="$helper_branch" >/dev/null
            fi
          }

          delete_helper_file() {
            local path="$1" message="$2" sha
            sha="$(GH_TOKEN="$helper_token" gh api "repos/$helper_repo/contents/$path?ref=$helper_branch" --jq .sha 2>/dev/null || true)"
            [[ -z "$sha" ]] || GH_TOKEN="$helper_token" gh api --method DELETE "repos/$helper_repo/contents/$path" \
              -f message="$message" -f sha="$sha" -f branch="$helper_branch" >/dev/null
          }

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$work/private.pem" >/dev/null 2>&1
          openssl pkey -in "$work/private.pem" -pubout -out "$work/public.pem" >/dev/null 2>&1
          put_helper_file "$PUBLIC_KEY_PATH" "$work/public.pem" "ops: publish one-time cleanup public key"

          found=false
          for _ in $(seq 1 240); do
            if GH_TOKEN="$helper_token" gh api "repos/$helper_repo/contents/$CIPHERTEXT_PATH?ref=$helper_branch" --jq .content > "$work/file-content.b64" 2>/dev/null; then
              tr -d '\n' < "$work/file-content.b64" | base64 -d > "$work/ciphertext.b64"
              base64 -d "$work/ciphertext.b64" > "$work/ciphertext.bin"
              found=true
              break
            fi
            sleep 5
          done
          [[ "$found" == true ]] || { echo "encrypted token was not supplied before timeout" >&2; exit 2; }

          target_token="$(openssl pkeyutl -decrypt -inkey "$work/private.pem" -in "$work/ciphertext.bin" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)"
          echo "::add-mask::$target_token"
          [[ -n "$target_token" ]] || { echo "decrypted token is empty" >&2; exit 2; }

          GH_TOKEN="$target_token" gh api "repos/$TARGET_REPO/contents/$TARGET_SCRIPT?ref=$TARGET_REF" --jq .content \
            | tr -d '\n' | base64 -d > "$work/prune.sh"
          chmod 700 "$work/prune.sh"
          GH_TOKEN="$target_token" TARGET_REPO="$TARGET_REPO" "$work/prune.sh"

          delete_helper_file "$CIPHERTEXT_PATH" "ops: remove encrypted cleanup payload"
          delete_helper_file "$PUBLIC_KEY_PATH" "ops: remove one-time cleanup public key"
          delete_helper_file "$WORKFLOW_PATH" "ops: remove completed cleanup bridge"

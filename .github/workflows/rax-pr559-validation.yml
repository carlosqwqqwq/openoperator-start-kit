name: RAX PR559 validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rax-pr559-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rax-pr559-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Receive one-time encrypted credential and validate private PR
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p rax-pr559
          rm -f rax-pr559/public-key.pem rax-pr559/result.json
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/rax-pr559-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/rax-pr559-private.pem \
            -out rax-pr559/public-key.pem >/dev/null 2>&1

          git config user.name "rax-validation-bot"
          git config user.email "102978772+carlosqwqqwq@users.noreply.github.com"
          git pull --rebase origin main
          git add rax-pr559/public-key.pem
          git commit -m "ci: publish one-time PR559 validation key"
          git push origin main

          found=0
          for _ in $(seq 1 90); do
            git pull --rebase origin main >/dev/null 2>&1 || true
            if [[ -s rax-pr559/token.enc.b64 ]]; then
              found=1
              break
            fi
            sleep 1
          done
          [[ "$found" -eq 1 ]] || exit 2

          base64 -d rax-pr559/token.enc.b64 > /tmp/rax-pr559-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/rax-pr559-private.pem \
            -in /tmp/rax-pr559-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/rax-pr559-token
          chmod 600 /tmp/rax-pr559-token

          cat > /tmp/rax-pr559-askpass <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat /tmp/rax-pr559-token ;;
            *) printf '\n' ;;
          esac
          ASKPASS
          chmod 700 /tmp/rax-pr559-askpass
          export GIT_ASKPASS=/tmp/rax-pr559-askpass
          export GIT_TERMINAL_PROMPT=0

          clone_rc=0
          git clone --single-branch --branch fix/honest-route-evidence-20260924 \
            https://github.com/carlosqwqqwq/rax-research.git /tmp/rax-pr559-repo \
            >/tmp/rax-pr559-clone.log 2>&1 || clone_rc=$?
          install_rc=99
          targeted_rc=99
          ruff_rc=99
          compile_rc=99
          full_rc=99
          head_sha=""
          if [[ "$clone_rc" -eq 0 ]]; then
            cd /tmp/rax-pr559-repo
            head_sha="$(git rev-parse HEAD)"
            git submodule update --init --recursive \
              >/tmp/rax-pr559-submodules.log 2>&1 || true
            python -m pip install --upgrade pip \
              >/tmp/rax-pr559-install.log 2>&1
            python -m pip install -e ".[dev,agent]" \
              >>/tmp/rax-pr559-install.log 2>&1
            install_rc=$?
            if [[ "$install_rc" -eq 0 ]]; then
              python -m pytest -q tests/test_real_repo_adapter.py \
                >/tmp/rax-pr559-targeted.log 2>&1
              targeted_rc=$?
              python -m ruff check \
                benchmarks/real_repos/adapter.py \
                benchmarks/real_repos/run_dataset_task.py \
                tests/test_real_repo_adapter.py \
                >/tmp/rax-pr559-ruff.log 2>&1
              ruff_rc=$?
              python -m compileall -q \
                benchmarks/real_repos src/rax tests/test_real_repo_adapter.py \
                >/tmp/rax-pr559-compile.log 2>&1
              compile_rc=$?
              python -m pytest -q >/tmp/rax-pr559-full.log 2>&1
              full_rc=$?
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          python - "$clone_rc" "$install_rc" "$targeted_rc" "$ruff_rc" \
            "$compile_rc" "$full_rc" "$head_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          names = (
              "clone_rc", "install_rc", "targeted_pytest_rc",
              "ruff_rc", "compileall_rc", "full_pytest_rc",
          )
          values = [int(value) for value in sys.argv[1:7]]
          logs = {}
          for name in ("clone", "submodules", "install", "targeted", "ruff", "compile", "full"):
              path = Path(f"/tmp/rax-pr559-{name}.log")
              if path.exists():
                  text = path.read_text(encoding="utf-8", errors="replace")
                  logs[name] = "\n".join(text.splitlines()[-120:])
          payload = {
              "schema": "rax.pr-validation.v1",
              "status": "pass" if values == [0, 0, 0, 0, 0, 0] else "fail",
              "repository": "carlosqwqqwq/rax-research",
              "branch": "fix/honest-route-evidence-20260924",
              "head_sha": sys.argv[7],
              **dict(zip(names, values, strict=True)),
              "log_tails": logs,
          }
          Path("rax-pr559/result.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f rax-pr559/token.enc.b64 rax-pr559/public-key.pem
          rm -f /tmp/rax-pr559-token /tmp/rax-pr559-token.enc \
            /tmp/rax-pr559-private.pem /tmp/rax-pr559-askpass
          git add -A rax-pr559
          git commit -m "ci: record PR559 validation result" || true
          git push origin main

          if [[ "$clone_rc" -ne 0 || "$install_rc" -ne 0 || \
                "$targeted_rc" -ne 0 || "$ruff_rc" -ne 0 || \
                "$compile_rc" -ne 0 || "$full_rc" -ne 0 ]]; then
            exit 1
          fi

name: RAX candidate-entry validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rax-pr559-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rax-candidate-entry-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Validate private branch with one-time encrypted credential
        shell: bash
        run: |
          set -uo pipefail
          state="rax-candidate-entry-validation"
          mkdir -p "$state"
          rm -f "$state/public-key.pem" "$state/result.json"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -out /tmp/rax-entry-private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/rax-entry-private.pem \
            -out "$state/public-key.pem" >/dev/null 2>&1

          git config user.name "rax-validation-bot"
          git config user.email "102978772+carlosqwqqwq@users.noreply.github.com"
          git pull --rebase origin main
          git add "$state/public-key.pem"
          git commit -m "ci: publish one-time candidate-entry validation key"
          git push origin main

          found=0
          for _ in $(seq 1 450); do
            git pull --rebase origin main >/dev/null 2>&1 || true
            if [[ -s "$state/token.enc.b64" ]]; then
              found=1
              break
            fi
            sleep 2
          done
          [[ "$found" -eq 1 ]] || exit 2

          base64 -d "$state/token.enc.b64" > /tmp/rax-entry-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/rax-entry-private.pem \
            -in /tmp/rax-entry-token.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/rax-entry-token
          chmod 600 /tmp/rax-entry-token

          cat > /tmp/rax-entry-askpass <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) cat /tmp/rax-entry-token ;;
            *) printf '\n' ;;
          esac
          ASKPASS
          chmod 700 /tmp/rax-entry-askpass
          export GIT_ASKPASS=/tmp/rax-entry-askpass
          export GIT_TERMINAL_PROMPT=0

          clone_rc=0
          git clone --single-branch \
            --branch fix/unactivated-candidate-entry-20260924 \
            https://github.com/carlosqwqqwq/rax-research.git \
            /tmp/rax-entry-repo \
            >/tmp/rax-entry-clone.log 2>&1 || clone_rc=$?

          install_rc=99
          targeted_rc=99
          ruff_rc=99
          compile_rc=99
          full_rc=99
          head_sha=""
          if [[ "$clone_rc" -eq 0 ]]; then
            cd /tmp/rax-entry-repo
            head_sha="$(git rev-parse HEAD)"
            git submodule update --init --recursive \
              >/tmp/rax-entry-submodules.log 2>&1 || true
            python -m pip install --upgrade pip \
              >/tmp/rax-entry-install.log 2>&1
            python -m pip install -e ".[dev,agent]" \
              >>/tmp/rax-entry-install.log 2>&1
            install_rc=$?
            if [[ "$install_rc" -eq 0 ]]; then
              python -m pytest -q \
                tests/test_real_repo_adapter.py \
                tests/test_xxhash_checkpoint.py \
                tests/test_xxhash_submission.py \
                tests/test_rax_bench_candidate_activation.py \
                tests/test_target_presence.py \
                >/tmp/rax-entry-targeted.log 2>&1
              targeted_rc=$?
              python -m ruff check \
                benchmarks/agent_eval/xxhash_checkpoint.py \
                benchmarks/real_repos/adapter.py \
                benchmarks/real_repos/run_dataset_task.py \
                datasets/rax_bench/tasks/xxhash-pr1070/run.py \
                tests/test_real_repo_adapter.py \
                tests/test_xxhash_checkpoint.py \
                tests/test_xxhash_submission.py \
                tests/test_rax_bench_candidate_activation.py \
                >/tmp/rax-entry-ruff.log 2>&1
              ruff_rc=$?
              python -m compileall -q \
                benchmarks/agent_eval/xxhash_checkpoint.py \
                benchmarks/real_repos \
                datasets/rax_bench/tasks/xxhash-pr1070/run.py \
                tests/test_real_repo_adapter.py \
                tests/test_xxhash_checkpoint.py \
                tests/test_xxhash_submission.py \
                tests/test_rax_bench_candidate_activation.py \
                >/tmp/rax-entry-compile.log 2>&1
              compile_rc=$?
              python -m pytest -q >/tmp/rax-entry-full.log 2>&1
              full_rc=$?
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          python - "$clone_rc" "$install_rc" "$targeted_rc" "$ruff_rc" \
            "$compile_rc" "$full_rc" "$head_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          names = (
              "clone_rc",
              "install_rc",
              "targeted_pytest_rc",
              "ruff_rc",
              "compileall_rc",
              "full_pytest_rc",
          )
          values = [int(value) for value in sys.argv[1:7]]
          logs = {}
          for name in (
              "clone", "submodules", "install", "targeted", "ruff",
              "compile", "full",
          ):
              path = Path(f"/tmp/rax-entry-{name}.log")
              if path.exists():
                  text = path.read_text(encoding="utf-8", errors="replace")
                  logs[name] = "\n".join(text.splitlines()[-160:])
          payload = {
              "schema": "rax.branch-validation.v1",
              "status": "pass" if values == [0, 0, 0, 0, 0, 0] else "fail",
              "repository": "carlosqwqqwq/rax-research",
              "branch": "fix/unactivated-candidate-entry-20260924",
              "head_sha": sys.argv[7],
              **dict(zip(names, values, strict=True)),
              "log_tails": logs,
          }
          Path("rax-candidate-entry-validation/result.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          rm -f "$state/token.enc.b64" "$state/public-key.pem"
          rm -f /tmp/rax-entry-token /tmp/rax-entry-token.enc \
            /tmp/rax-entry-private.pem /tmp/rax-entry-askpass
          git add -A "$state"
          git commit -m "ci: record candidate-entry validation result" || true
          git push origin main

          if [[ "$clone_rc" -ne 0 || "$install_rc" -ne 0 || \
                "$targeted_rc" -ne 0 || "$ruff_rc" -ne 0 || \
                "$compile_rc" -ne 0 || "$full_rc" -ne 0 ]]; then
            exit 1
          fi
